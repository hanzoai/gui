# Publishes the lockstep train — every public package in the tree, @hanzo/gui
# among them — when a push to main names a version npm does not serve yet.
#
# A release is two steps and this is the second. The first is a person running
# `bun ./scripts/release.ts --minor --skip-publish` (or --patch), which writes
# the next version into every package.json, commits `v<version>`, tags it and
# pushes. That push lands here.
#
# The question is asked of the registry, not of the diff: @hanzo/gui's version
# on disk strictly greater than npm's `latest` is a release, anything else is
# not. The train moves in lockstep, so the umbrella's version is the train's.
# A dispatch at the version npm already serves finishes a release that stopped
# part way; release.ts skips every name@version already published, so running
# it twice publishes nothing twice.
#
# What publishes is release.ts itself, in --republish mode: the one script that
# rewrites workspace:* into real versions before it packs. The token is read
# from KMS at run time (NPM_TOKEN at the org root, env prod), as hanzoai/i18n
# does, and masked before anything can print it.
name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: [linux-amd64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Is this version ahead of npm?
        id: ahead
        run: |
          set -euo pipefail
          NAME=$(jq -r .name pkgs/ui/hanzogui/package.json)
          NEW=$(jq -r .version pkgs/ui/hanzogui/package.json)
          OLD=$(curl -sf -H 'Accept: application/vnd.npm.install-v1+json' "https://registry.npmjs.org/${NAME}" | jq -r '."dist-tags".latest // "0.0.0"' || echo 0.0.0)
          TOP=$(printf '%s\n%s\n' "$OLD" "$NEW" | sort -V | tail -1)
          echo "version=$NEW" >> "$GITHUB_OUTPUT"
          if [ "$OLD" != "$NEW" ] && [ "$TOP" = "$NEW" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "$NAME $OLD -> $NEW"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "$OLD" = "$NEW" ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "$NAME $NEW is npm's latest; finishing whatever of the train is missing"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "$NAME $NEW is not ahead of npm ($OLD); nothing to publish"
          fi

      # The first install builds every package (the root postinstall does, on a
      # tree with no dist); the second links the bins those builds emit.
      - name: Install and build
        if: steps.ahead.outputs.release == 'true'
        uses: ./.github/actions/install

      - name: Build, check, lint, typecheck
        if: steps.ahead.outputs.release == 'true'
        run: |
          set -euo pipefail
          bun run build
          bun run check
          bun run lint
          bun run typecheck

      - name: Read the npm token from KMS
        if: steps.ahead.outputs.release == 'true'
        id: npm
        env:
          KMS_CLIENT_ID: ${{ secrets.KMS_CLIENT_ID }}
          KMS_CLIENT_SECRET: ${{ secrets.KMS_CLIENT_SECRET }}
          KMS_ENDPOINT: ${{ vars.KMS_ENDPOINT || 'https://kms.hanzo.ai' }}
          KMS_SECRET_ENV: ${{ vars.KMS_SECRET_ENV || 'prod' }}
        run: |
          set -uo pipefail
          body="{\"clientId\":\"${KMS_CLIENT_ID}\",\"clientSecret\":\"${KMS_CLIENT_SECRET}\"}"
          out=$(curl -sS -w '\n%{http_code}' "${KMS_ENDPOINT}/v1/kms/auth/login" -H 'Content-Type: application/json' --data-binary "$body")
          code=${out##*$'\n'}; resp=${out%$'\n'*}
          [ "$code" = "200" ] || { echo "::error::KMS login answered HTTP $code"; exit 1; }
          token=$(printf '%s' "$resp" | jq -r '.accessToken // empty')
          [ -n "$token" ] || { echo "::error::KMS login carried no accessToken"; exit 1; }
          echo "::add-mask::${token}"
          for attempt in 1 2 3 4 5; do
            out=$(curl -sS -w '\n%{http_code}' "${KMS_ENDPOINT}/v1/kms/secrets/NPM_TOKEN?env=${KMS_SECRET_ENV}" -H "Authorization: Bearer ${token}")
            code=${out##*$'\n'}; resp=${out%$'\n'*}
            case "$code" in 200) break ;; 5*) sleep 15 ;; *) break ;; esac
          done
          [ "$code" = "200" ] || { echo "::error::KMS secret read answered HTTP $code"; exit 1; }
          npm_token=$(printf '%s' "$resp" | jq -r '.value // empty')
          [ -n "$npm_token" ] || { echo "::error::No NPM_TOKEN in KMS"; exit 1; }
          echo "::add-mask::${npm_token}"
          echo "token=${npm_token}" >> "$GITHUB_OUTPUT"

      - name: Publish the train
        if: steps.ahead.outputs.release == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ steps.npm.outputs.token }}
          CI: 'true'
        run: bun ./scripts/release.ts --republish --ci

      - name: npm serves it
        if: steps.ahead.outputs.release == 'true'
        run: |
          set -euo pipefail
          v=${{ steps.ahead.outputs.version }}
          for attempt in $(seq 1 20); do
            got=$(curl -sf -H 'Accept: application/vnd.npm.install-v1+json' https://registry.npmjs.org/@hanzo/gui | jq -r '."dist-tags".latest' || true)
            [ "$got" = "$v" ] && { echo "@hanzo/gui latest = $got"; exit 0; }
            sleep 15
          done
          echo "::error::@hanzo/gui latest is $got, not $v"
          exit 1
