name: Checks

on:
  workflow_dispatch:
  pull_request:
  push:
    paths-ignore:
      - 'assets/**'
      - '.vscode/**'
    branches:
      - main
      - v2
      - 'v2-*'

# cancel in-progress runs on the same branch (avoids duplicate PR + push runs)
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: hanzo-build-linux-amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install
        uses: ./.github/actions/install

      - name: Check
        run: bun run check


      - name: Lint
        run: bun run lint

  unit-tests:
    runs-on: hanzo-build-linux-amd64
    env:
      NODE_OPTIONS: '--max-old-space-size=6144'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install
        uses: ./.github/actions/install

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(bunx playwright --version | awk '{print $2}')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install playwright
        run: bunx playwright install

      - name: Run unit tests
        run: bun turbo run test:web --filter='!@hanzogui/kitchen-sink' --concurrency=1
