name: 'npm token'
description: 'Resolve the registry credential from Hanzo KMS. The one place this repo asks.'

# Two workflows publish from here and each carried its own copy of the
# resolution. Both copies called INFISICAL — `/api/v1/auth/universal-auth/login`
# and `/api/v3/secrets/raw?workspaceId=…` — which is an upstream secret manager
# this estate does not run, and which also carries the `/api/` prefix nothing
# here uses. `curl -sf` failed, `|| true` swallowed it, and the step exited 1 in
# ONE SECOND. That is the tell: a credential lookup that fails instantly never
# reached a server. The packages were published by hand for as long as it lasted.
#
# Hanzo KMS is `POST /v1/kms/auth/login` for a short-lived token, then
# `GET /v1/kms/secrets/<KEY>?env=<env>` returning a flat `{"value"}` — the same
# two calls hanzoai/app's release lane makes. `NPM_TOKEN` is already there, at
# the org root, and reads clean.
#
# The repo-secret fallback stays, because a repo that has one should not need
# KMS to be reachable to publish. It is a fallback and not the path: the token
# belongs in KMS, where it is rotated once for everybody.

inputs:
  kms_client_id:
    description: 'KMS universal-auth client id (secrets.KMS_CLIENT_ID)'
    required: false
  kms_client_secret:
    description: 'KMS universal-auth client secret (secrets.KMS_CLIENT_SECRET)'
    required: false
  fallback:
    description: 'Repo-secret NPM_TOKEN, used only when KMS yields nothing'
    required: false
  endpoint:
    description: 'KMS endpoint'
    required: false
    default: 'https://api.hanzo.ai'
  env:
    description: 'KMS environment'
    required: false
    default: 'prod'

outputs:
  token:
    description: 'The npm registry token. Masked in the log.'
    value: ${{ steps.resolve.outputs.token }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      env:
        KMS_CLIENT_ID: ${{ inputs.kms_client_id }}
        KMS_CLIENT_SECRET: ${{ inputs.kms_client_secret }}
        FALLBACK: ${{ inputs.fallback }}
        ENDPOINT: ${{ inputs.endpoint }}
        KMS_ENV: ${{ inputs.env }}
      run: |
        set -uo pipefail
        token=""
        if [ -n "${KMS_CLIENT_ID:-}" ] && [ -n "${KMS_CLIENT_SECRET:-}" ]; then
          # A TIMEOUT IS NOT AN ABSENT SECRET, and this said it was. `curl -m 30`
          # returns nothing when the edge is slow, jq then yields empty, and the
          # message read "NPM_TOKEN absent from KMS" about a token that is sealed
          # and reads clean the minute after. @hanzogui/shell 8.1.54 sat
          # unpublished for a day that way, holding a dead footer link on 949
          # pages of hanzo.ai, because the one sentence in the log named the
          # wrong thing.
          #
          # Ask again on the codes that mean ask again — nothing arrived, 429,
          # any 5xx — take 401/403/404 on the first try, and name the code when
          # it is none of those. The wait grows, because an edge in trouble is in
          # it for minutes.
          ask() {  # ask <what> <url> [curl args...] -> body on stdout when 2xx
            local what=$1 url=$2; shift 2
            local code
            for wait in 0 5 15 45; do
              [ "$wait" = 0 ] || sleep "$wait"
              # `|| code=000` on the ASSIGNMENT, not `|| echo 000` inside the
              # substitution: -w already prints 000 when curl fails, so echoing a
              # second one made the variable "000000", which matched no case here
              # and turned an outage into a refusal that never retried.
              code=$(curl -sS -m 30 -o /tmp/kms.body -w '%{http_code}' "$url" "$@") || code=000
              case "$code" in
                2*) cat /tmp/kms.body; return 0 ;;
                000|429|5*) continue ;;
                *) echo "::warning::KMS answered $code for the $what: $(head -c 200 /tmp/kms.body)" >&2; return 1 ;;
              esac
            done
            echo "::warning::KMS did not answer the $what — HTTP $code over four tries. An outage, not a missing secret." >&2
            return 1
          }
          access=$(ask login "${ENDPOINT}/v1/kms/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"clientId\":\"${KMS_CLIENT_ID}\",\"clientSecret\":\"${KMS_CLIENT_SECRET}\"}" \
            | jq -r '.accessToken // empty' 2>/dev/null || true)
          if [ -z "$access" ]; then
            echo "::warning::KMS login yielded no accessToken at ${ENDPOINT}/v1/kms/auth/login"
          else
            token=$(ask secret "${ENDPOINT}/v1/kms/secrets/NPM_TOKEN?env=${KMS_ENV}" \
              -H "Authorization: Bearer ${access}" | jq -r '.value // empty' 2>/dev/null || true)
            [ -n "$token" ] || echo "::warning::no NPM_TOKEN value came back from KMS (env ${KMS_ENV})"
          fi
        fi
        if [ -z "$token" ]; then
          token="${FALLBACK:-}"
          [ -n "$token" ] && echo "resolved from the repo secret (KMS yielded nothing)"
        else
          echo "resolved from KMS (${#token} chars)"
        fi
        if [ -z "$token" ]; then
          echo "::error::No npm credential. Needs KMS_CLIENT_ID + KMS_CLIENT_SECRET, or an NPM_TOKEN repo secret."
          exit 1
        fi
        echo "::add-mask::${token}"
        echo "token=${token}" >> "$GITHUB_OUTPUT"
