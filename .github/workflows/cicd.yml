name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cicd:
    uses: hanzoai/ci/.github/workflows/build.yml@v1
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
